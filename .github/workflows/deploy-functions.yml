# ---------- CODEGEN CHECKLIST (must be satisfied) ----------
# 1. Uses Azure Functions deployment best practices
# 2. Includes build validation before deployment
# 3. Separates build and deploy stages
# 4. Uses environment-specific configurations
# 5. CI-friendly: runs lint, typecheck, and tests
# -----------------------------------------------------------

name: Deploy Azure Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'common/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Build Azure Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        run: pnpm --filter @tastematcher/common build

      - name: Lint functions
        run: pnpm --filter @tastematcher/functions lint

      - name: Type check functions
        run: pnpm --filter @tastematcher/functions typecheck

      - name: Run tests
        run: pnpm --filter @tastematcher/functions test

      - name: Build functions
        run: pnpm --filter @tastematcher/functions build

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: |
            functions/dist
            functions/host.json
            functions/ProcessImagesFromBlob
            functions/package.json
          retention-days: 1

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    environment:
      name: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: ./functions/dist

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Functions
        run: |
          chmod +x scripts/azure/deploy-functions.sh
          ./scripts/azure/deploy-functions.sh dev

      - name: Azure logout
        run: az logout
        if: always()

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.environment == 'prod'
    environment:
      name: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: ./functions

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Deploy to Azure Functions
        run: |
          cd functions
          chmod +x ../scripts/azure/deploy-functions.sh
          ../scripts/azure/deploy-functions.sh prod

      - name: Azure logout
        run: az logout
        if: always()
