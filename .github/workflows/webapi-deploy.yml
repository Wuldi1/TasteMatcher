name: Web API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'webapi/**'
      - 'common/**'
      - '.github/workflows/webapi-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '8'
  WEBAPI_DIR: webapi
  BUILD_OUTPUT: webapi/dist
  AZURE_WEBAPP_NAME: tastematcher-dev-api

jobs:
  build-test:
    name: Build & Test Web API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        run: pnpm --filter @tastematcher/common build

      - name: Lint Web API
        run: pnpm --filter @tastematcher/webapi lint

      - name: Type check Web API
        run: pnpm --filter @tastematcher/webapi typecheck

      # - name: Test Web API
      #   run: pnpm --filter @tastematcher/webapi test -- --ci

      - name: Build Web API
        run: pnpm --filter @tastematcher/webapi build

      - name: Prepare deployment package
        run: |
          cd ${{ env.WEBAPI_DIR }}
          mkdir -p deploy
          
          # Copy built files
          cp -r dist deploy/
          
          # Copy package.json
          cp package.json deploy/
          
          # Install production dependencies only using pnpm
          cd deploy
          corepack enable
          pnpm install --prod --frozen-lockfile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-dist
          path: ${{ env.WEBAPI_DIR }}/deploy
          retention-days: 1

  deploy-dev:
    name: Deploy to tastematcher-dev-api
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-dist
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Azure logout
        if: always()
        run: az logout
