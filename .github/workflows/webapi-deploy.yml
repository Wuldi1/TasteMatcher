name: Web API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "webapi/**"
      - "common/**"
      - ".github/workflows/webapi-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          # - stg
          - prd

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "8"
  WEBAPI_DIR: webapi
  BUILD_OUTPUT: webapi/build

jobs:
  build-test:
    name: Build & Test Web API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm run install:all

      - name: Build common + Web API packages
        run: pnpm run build:webapi

      - name: Prepare deployment package
        run: |
          cd ${{ env.WEBAPI_DIR }}
          cp package.json build/
          sed -i 's|build/main.js|main.js|g' build/package.json

          # Ensure all node_modules files are copied successfully
          mkdir -p build/node_modules
          rsync -a node_modules/ ../node_modules/ build/node_modules/

          # Copy @tastematcher/common into node_modules
          rm -rf build/node_modules/@tastematcher/common
          mkdir -p build/node_modules/@tastematcher/common
          rsync -a ../common/build/ build/node_modules/@tastematcher/common

          cd build
          zip -r ../webapi-build.zip . > /dev/null

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-build
          path: ${{ env.WEBAPI_DIR }}/webapi-build.zip
          retention-days: 1

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ github.event.inputs.environment == 'stg' && 'https://tastematcher-stg-api.azurewebsites.net' || github.event.inputs.environment == 'prd' && 'https://tastematcher-prd-api.azurewebsites.net' || 'https://tastematcher-dev-api.azurewebsites.net' }}

    steps:
      - name: Set Environment Variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "stg" ]; then
            echo "AZURE_WEBAPP_NAME=tastematcher-stg-api" >> $GITHUB_ENV
            echo "AZURE_RESOURCE_GROUP=tastematcher-stg-rg" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=e105e38a-7820-4c7e-b1da-de05227d6355" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prd" ]; then
            echo "AZURE_WEBAPP_NAME=tastematcher-prd-api" >> $GITHUB_ENV
            echo "AZURE_RESOURCE_GROUP=tastematcher-prd-rg" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=e105e38a-7820-4c7e-b1da-de05227d6355" >> $GITHUB_ENV
          else
            echo "AZURE_WEBAPP_NAME=tastematcher-dev-api" >> $GITHUB_ENV
            echo "AZURE_RESOURCE_GROUP=tastematcher-dev-rg" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=e105e38a-7820-4c7e-b1da-de05227d6355" >> $GITHUB_ENV
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ github.event.inputs.environment == 'stg' && secrets.AZURE_CREDENTIALS_STG || github.event.inputs.environment == 'prd' && secrets.AZURE_CREDENTIALS_PRD || secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapi-build.zip
          startup-command: "npm start"

      - name: Azure logout
        if: always()
        run: az logout
