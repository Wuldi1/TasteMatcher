name: Web API CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "webapi/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/webapi-deploy.yml"
  push:
    branches: [main]
    paths:
      - "webapi/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/webapi-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapi-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"
  WEBAPI_DIR: webapi
  AZURE_CONTAINERAPP_NAME: tastematcher-prd-api-ca
  AZURE_CONTAINER_REGISTRY: tastematcherprdacr
  AZURE_RESOURCE_GROUP: tastematcher-prd-rg

jobs:
  build-test:
    name: Validate, Test & Build Web API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package for dependent checks
        run: pnpm run build:common
      - name: Lint shared and Web API code
        run: |
          pnpm --filter @tastematcher/common lint
          pnpm --filter @tastematcher/webapi lint
      - name: Type-check shared and Web API code
        run: |
          pnpm --filter @tastematcher/common typecheck
          pnpm --filter @tastematcher/webapi typecheck
      - name: Run shared and Web API tests
        run: |
          pnpm --filter @tastematcher/common test
          pnpm --filter @tastematcher/webapi exec jest --runInBand
      - name: Validate repository and build artifact
        run: pnpm run validate:static

  deploy:
    name: Deploy Web API to Production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: prd
      url: https://tastematcher-prd-api-ca.lemonwave-6134900c.centralus.azurecontainerapps.io
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRD }}
      - name: Build and publish API image
        run: az acr build --registry "$AZURE_CONTAINER_REGISTRY" --image "tastematcher-api:$IMAGE_TAG" --file webapi/Dockerfile .
      - name: Deploy API revision to Container Apps
        run: az containerapp update --name "$AZURE_CONTAINERAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --image "$AZURE_CONTAINER_REGISTRY.azurecr.io/tastematcher-api:$IMAGE_TAG"
      - name: Verify replacement API health
        run: |
          api_fqdn="$(az containerapp show --name "$AZURE_CONTAINERAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)"
          curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors "https://${api_fqdn}/health" >/dev/null
      - name: Azure logout
        if: always()
        run: az logout
