name: Web API CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "webapi/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/webapi-deploy.yml"
  push:
    branches: [main]
    paths:
      - "webapi/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/webapi-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapi-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"
  WEBAPI_DIR: webapi

jobs:
  build-test:
    name: Validate, Test & Build Web API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package for dependent checks
        run: pnpm run build:common
      - name: Lint shared and Web API code
        run: |
          pnpm --filter @tastematcher/common lint
          pnpm --filter @tastematcher/webapi lint
      - name: Type-check shared and Web API code
        run: |
          pnpm --filter @tastematcher/common typecheck
          pnpm --filter @tastematcher/webapi typecheck
      - name: Run shared and Web API tests
        run: |
          pnpm --filter @tastematcher/common test
          pnpm --filter @tastematcher/webapi exec jest --runInBand
      - name: Build common and Web API packages
        run: pnpm run build:webapi
      - name: Prepare deployment package
        run: |
          cd ${{ env.WEBAPI_DIR }}
          cp package.json build/
          sed -i 's|build/main.js|main.js|g' build/package.json
          mkdir -p build/node_modules
          rsync -a node_modules/ ../node_modules/ build/node_modules/
          rm -rf build/node_modules/@tastematcher/common
          mkdir -p build/node_modules/@tastematcher/common
          rsync -a ../common/build/ build/node_modules/@tastematcher/common
          cd build
          zip -r ../webapi-build.zip . >/dev/null
      - name: Validate repository and build artifact
        run: pnpm run validate:static
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-build
          path: ${{ env.WEBAPI_DIR }}/webapi-build.zip
          retention-days: 1

  deploy:
    name: Deploy Web API to Production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: prd
      url: https://api.tastematcher.art
    env:
      AZURE_WEBAPP_NAME: tastematcher-prd-api
      AZURE_RESOURCE_GROUP: tastematcher-prd-rg
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-build
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PRD }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: webapi-build.zip
          startup-command: "npm start"
      - name: Verify production API health
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors https://api.tastematcher.art/health >/dev/null
      - name: Azure logout
        if: always()
        run: az logout
