name: Web API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'webapi/**'
      - 'common/**'
      - '.github/workflows/webapi-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '8'
  WEBAPI_DIR: webapi
  BUILD_OUTPUT: webapi/build
  AZURE_WEBAPP_NAME: tastematcher-dev-api

jobs:
  build-test:
    name: Build & Test Web API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm run install:all

      - name: Build common + Web API packages
        run: pnpm run build:webapi

      - name: Pack common package
        run: cd common && npm pack --silent

      - name: Prepare deployment package
        run: |
          cd ${{ env.WEBAPI_DIR }}
          cp package.json build/
          mkdir build/node_modules
          cp -r node_modules/* build/node_modules/
          mkdir -p build/node_modules/@tastematcher
          cp -r ../../common/build build/node_modules/@tastematcher/common

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapi-build
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 1

  deploy-dev:
    name: Deploy to tastematcher-dev-api
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webapi-build
          path: build

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: 'build'
          startup-command: 'npm start'

      - name: Azure logout
        if: always()
        run: az logout
