# ---------- CODEGEN CHECKLIST (must be satisfied) ----------
# 1. Uses Azure Functions deployment best practices
# 2. Includes build validation before deployment
# 3. Separates build and deploy stages
# 4. Uses environment-specific configurations
# 5. CI-friendly: runs lint, typecheck, and tests
# -----------------------------------------------------------

name: Functions CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'common/**'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  NODE_VERSION: '22.x'
  AZURE_FUNCTIONAPP_NAME: tastematcher-dev-func
  AZURE_RESOURCE_GROUP: tastematcher-dev-rg

jobs:
  build:
    name: Build Azure Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        run: pnpm --filter @tastematcher/common build

      - name: Lint functions
        run: pnpm --filter @tastematcher/functions lint

      - name: Type check functions
        run: pnpm --filter @tastematcher/functions typecheck

      # - name: Run tests
      #   run: pnpm --filter @tastematcher/functions test

      - name: Build functions
        run: pnpm --filter @tastematcher/functions build

      - name: Prepare deployment package
        run: |
          cd functions
          mkdir -p deploy
          cp -r build/* deploy/
          cp host.json deploy/
          if [ -d "ProcessImagesFromBlob" ]; then
            mkdir -p deploy/ProcessImagesFromBlob
            cp ProcessImagesFromBlob/function.json deploy/ProcessImagesFromBlob/
          fi
          
          # Install production dependencies in temp directory
          TEMP_DIR=$(mktemp -d)
          cat > "$TEMP_DIR/package.json" <<EOF
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": $(jq '.dependencies' package.json | jq 'del(.["@tastematcher/common"])'),
            "engines": {
              "node": ">=22.x"
            }
          }
          EOF
          
          cd "$TEMP_DIR"
          npm install --omit=dev --no-package-lock --production
          
          # Get back to project root to access functions/deploy
          cd $GITHUB_WORKSPACE/functions
          
          # Copy node_modules to deploy
          cp -r "$TEMP_DIR/node_modules" deploy/
          
          # Copy common package build
          if [ -d "$GITHUB_WORKSPACE/common/build" ]; then
            mkdir -p deploy/node_modules/@tastematcher/common
            cp -r $GITHUB_WORKSPACE/common/build/* deploy/node_modules/@tastematcher/common/
            cp $GITHUB_WORKSPACE/common/package.json deploy/node_modules/@tastematcher/common/
            sed -i 's|build/index.|index.|g' deploy/node_modules/@tastematcher/common/package.json
          fi
          
          # Create minimal package.json
          cd deploy
          cat > package.json <<'PKGJSON'
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "engines": {
              "node": ">=22.x"
            }
          }
          PKGJSON

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-deploy
          path: functions/deploy
          retention-days: 1

  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    environment:
      name: development
      url: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-deploy
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Ensure WEBSITE_RUN_FROM_PACKAGE is disabled (so files are extracted)
        run: |
          az functionapp config appsettings set \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings WEBSITE_RUN_FROM_PACKAGE=0

      - name: Zip deployment artifact
        run: |
          # package the downloaded deploy directory into a zip for Kudu upload
          cd deploy
          zip -r ../functions-deploy.zip . -x "*.map" -x "*.spec.js" -x "test/*" -x "__tests__/*"
          cd ..
          ls -lh functions-deploy.zip

      - name: Deploy zip via Kudu API (force extraction into wwwroot)
        run: |
          set -euo pipefail

          # Ensure Azure login succeeded
          echo "Verifying Azure login..."
          az account show --output table || { echo "Azure login failed — ensure azure/login step ran and creds are valid"; exit 1; }

          KUDU_USER=$(az webapp deployment list-publishing-credentials --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query publishingUserName -o tsv || echo "")
          KUDU_PASS=$(az webapp deployment list-publishing-credentials --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query publishingPassword -o tsv || echo "")
          SITE_SCM="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.scm.azurewebsites.net"

          # Sanity checks: Kudu creds must be present
          if [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
            echo "❌ Publishing credentials are empty. Cannot call Kudu API."
            echo "Common causes:"
            echo " - Service Principal used by azure/login lacks permission to list publishing credentials."
            echo " - Wrong subscription / context used by az login."
            echo "Debug info:"
            az account show --output json
            echo "Listing role assignments for the logged in principal (may help identify missing role):"
            az role assignment list --assignee "$(az account show --query user.name -o tsv)" --output json | jq -r '.[0:5]'
            echo ""
            echo "If using a Service Principal, ensure it has at least 'Contributor' on the resource group or 'Website Contributor' + Microsoft.Web/sites/publish permission."
            echo "As an alternative, you can provide the publish profile as a secret and parse it in the workflow."
            exit 1
          fi

          echo "KUDU user and password fetched (masked). Proceeding with upload..."
          # Upload and extract the zip into /site/wwwroot via Kudu's zip push API (verbose for diagnostics)
          set +e
          HTTP_OUTPUT=$(mktemp)
          curl --fail --show-error -v -u "$KUDU_USER:$KUDU_PASS" -X POST -H "Content-Type: application/zip" --data-binary @functions-deploy.zip "$SITE_SCM/api/zip/site/wwwroot/" -o "$HTTP_OUTPUT" 2>&1
          CURL_EXIT=$?
          set -e

          if [ $CURL_EXIT -ne 0 ]; then
            echo "❌ Kudu upload failed (curl exit $CURL_EXIT). Full curl output:"
            sed -n '1,400p' "$HTTP_OUTPUT" || true
            echo ""
            echo "HTTP response body (if any):"
            sed -n '1,200p' "$HTTP_OUTPUT" || true
            rm -f "$HTTP_OUTPUT"
            exit 1
          else
            echo "✅ Kudu upload succeeded. Server response:"
            sed -n '1,200p' "$HTTP_OUTPUT" || true
            rm -f "$HTTP_OUTPUT"
          fi

          # Ensure app isn't pinned to a mounted package (keep files extracted)
          az functionapp config appsettings set \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --settings WEBSITE_RUN_FROM_PACKAGE=0
          echo "✅ Uploaded and forced extraction via Kudu; WEBSITE_RUN_FROM_PACKAGE set to 0"

      - name: Restart Function App
        run: |
          az functionapp restart \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
