# ---------- CODEGEN CHECKLIST (must be satisfied) ----------
# 1. Uses Azure Functions deployment best practices
# 2. Includes build validation before deployment
# 3. Separates build and deploy stages
# 4. Uses environment-specific configurations
# 5. CI-friendly: runs lint, typecheck, and tests
# -----------------------------------------------------------

name: Functions CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'common/**'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prod

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Build Azure Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        run: pnpm --filter @tastematcher/common build

      - name: Lint functions
        run: pnpm --filter @tastematcher/functions lint

      - name: Type check functions
        run: pnpm --filter @tastematcher/functions typecheck

      # - name: Run tests
      #   run: pnpm --filter @tastematcher/functions test

      - name: Build functions
        run: pnpm --filter @tastematcher/functions build

      - name: Prepare deployment package
        run: |
          cd functions
          mkdir -p deploy
          cp -r build/* deploy/
          cp host.json deploy/
          if [ -d "ProcessImagesFromBlob" ]; then
            mkdir -p deploy/ProcessImagesFromBlob
            cp ProcessImagesFromBlob/function.json deploy/ProcessImagesFromBlob/
          fi
          
          # Install production dependencies in temp directory
          TEMP_DIR=$(mktemp -d)
          cat > "$TEMP_DIR/package.json" <<EOF
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": $(jq '.dependencies' package.json | jq 'del(.["@tastematcher/common"])'),
            "engines": {
              "node": ">=22.x"
            }
          }
          EOF
          
          cd "$TEMP_DIR"
          npm install --omit=dev --no-package-lock --production
          
          # Get back to project root to access functions/deploy
          cd $GITHUB_WORKSPACE/functions
          
          # Copy node_modules to deploy
          cp -r "$TEMP_DIR/node_modules" deploy/
          
          # Copy common package build
          if [ -d "$GITHUB_WORKSPACE/common/build" ]; then
            mkdir -p deploy/node_modules/@tastematcher/common
            cp -r $GITHUB_WORKSPACE/common/build/* deploy/node_modules/@tastematcher/common/
            cp $GITHUB_WORKSPACE/common/package.json deploy/node_modules/@tastematcher/common/
            sed -i 's|build/index.|index.|g' deploy/node_modules/@tastematcher/common/package.json
          fi
          
          # Create minimal package.json
          cd deploy
          cat > package.json <<'PKGJSON'
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "engines": {
              "node": ">=22.x"
            }
          }
          PKGJSON

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-deploy
          path: functions/deploy
          retention-days: 1

  deploy:
    name: Deploy to Azure Function App
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ github.event.inputs.environment == 'stg' && 'https://tastematcher-stg-func.azurewebsites.net' || github.event.inputs.environment == 'prod' && 'https://tastematcher-prod-func.azurewebsites.net' || 'https://tastematcher-dev-func.azurewebsites.net' }}

    steps:
      - name: Set Environment Variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "stg" ]; then
            echo "AZURE_FUNCTIONAPP_NAME=tastematcher-stg-func" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=${{ secrets.AZURE_SUBSCRIPTION_STG }}" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prod" ]; then
            echo "AZURE_FUNCTIONAPP_NAME=tastematcher-prod-func" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=${{ secrets.AZURE_SUBSCRIPTION_PROD }}" >> $GITHUB_ENV
          else
            echo "AZURE_FUNCTIONAPP_NAME=tastematcher-dev-func" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=${{ secrets.AZURE_SUBSCRIPTION_DEV }}" >> $GITHUB_ENV
          fi

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-deploy
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ github.event.inputs.environment == 'stg' && secrets.AZURE_CREDENTIALS_STG || github.event.inputs.environment == 'prod' && secrets.AZURE_CREDENTIALS_PROD || secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy

      - name: Azure logout
        if: always()
        run: az logout
