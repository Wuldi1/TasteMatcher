name: Functions CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/functions-deploy.yml"
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/functions-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"

jobs:
  build-test:
    name: Validate, Test & Build Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package for dependent checks
        run: pnpm run build:common
      - name: Lint shared and Functions code
        run: |
          pnpm --filter @tastematcher/common lint
          pnpm --filter @tastematcher/functions lint
      - name: Type-check shared and Functions code
        run: |
          pnpm --filter @tastematcher/common typecheck
          pnpm --filter @tastematcher/functions typecheck
      - name: Run shared and Functions tests
        run: |
          pnpm --filter @tastematcher/common test
          pnpm --filter @tastematcher/functions exec jest --runInBand
      - name: Build Functions
        run: pnpm run build:functions
      - name: Prepare deployment package
        run: |
          cd functions
          mkdir -p deploy
          cp -r build/* deploy/
          cp host.json deploy/
          if [ -d "ProcessImagesFromBlob" ]; then
            mkdir -p deploy/ProcessImagesFromBlob
            cp ProcessImagesFromBlob/function.json deploy/ProcessImagesFromBlob/
          fi
          TEMP_DIR=$(mktemp -d)
          cat > "$TEMP_DIR/package.json" <<EOF
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": $(jq '.dependencies' package.json | jq 'del(.["@tastematcher/common"])'),
            "engines": {
              "node": ">=24 <25"
            }
          }
          EOF
          cd "$TEMP_DIR"
          npm install --omit=dev --no-package-lock
          cd "$GITHUB_WORKSPACE/functions"
          cp -r "$TEMP_DIR/node_modules" deploy/
          if [ -d "$GITHUB_WORKSPACE/common/build" ]; then
            mkdir -p deploy/node_modules/@tastematcher/common
            cp -r "$GITHUB_WORKSPACE/common/build/"* deploy/node_modules/@tastematcher/common/
            cp "$GITHUB_WORKSPACE/common/package.json" deploy/node_modules/@tastematcher/common/
            sed -i 's|build/index.|index.|g' deploy/node_modules/@tastematcher/common/package.json
          fi
          cd deploy
          cat > package.json <<'PKGJSON'
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "engines": {
              "node": ">=24 <25"
            }
          }
          PKGJSON
      - name: Validate repository and build artifact
        run: pnpm run validate:static
      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-deploy
          path: functions/deploy
          retention-days: 1

  deploy:
    name: Deploy Functions to Production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: prd
      url: https://tastematcher-prd-flex.azurewebsites.net
    env:
      AZURE_FUNCTIONAPP_NAME: tastematcher-prd-flex
      AZURE_RESOURCE_GROUP: tastematcher-prd-rg
      AZURE_SUBSCRIPTION: e105e38a-7820-4c7e-b1da-de05227d6355
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-deploy
          path: deploy
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
      - name: Select production subscription
        run: az account set --subscription "${{ env.AZURE_SUBSCRIPTION }}"
      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy
      - name: Verify production Functions
        run: |
          test "$(az functionapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FUNCTIONAPP_NAME" --query properties.state -o tsv)" = "Running"
          test "$(az functionapp function list --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_FUNCTIONAPP_NAME" --query 'length(@)' -o tsv)" -gt 0
      - name: Azure logout
        if: always()
        run: az logout
