# ---------- CODEGEN CHECKLIST (must be satisfied) ----------
# 1. Uses Azure Functions deployment best practices
# 2. Includes build validation before deployment
# 3. Separates build and deploy stages
# 4. Uses environment-specific configurations
# 5. CI-friendly: runs lint, typecheck, and tests
# -----------------------------------------------------------

name: Functions CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'common/**'
      - '.github/workflows/functions-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  NODE_VERSION: '22.x'
  AZURE_FUNCTIONAPP_NAME: tastematcher-dev-func
  AZURE_RESOURCE_GROUP: tastematcher-dev-rg

jobs:
  build:
    name: Build Azure Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build common package
        run: pnpm --filter @tastematcher/common build

      - name: Lint functions
        run: pnpm --filter @tastematcher/functions lint

      - name: Type check functions
        run: pnpm --filter @tastematcher/functions typecheck

      # - name: Run tests
      #   run: pnpm --filter @tastematcher/functions test

      - name: Build functions
        run: pnpm --filter @tastematcher/functions build

      - name: Prepare deployment package
        run: |
          cd functions
          mkdir -p deploy
          cp -r build/* deploy/
          cp host.json deploy/
          if [ -d "ProcessImagesFromBlob" ]; then
            mkdir -p deploy/ProcessImagesFromBlob
            cp ProcessImagesFromBlob/function.json deploy/ProcessImagesFromBlob/
          fi
          
          # Install production dependencies in temp directory
          TEMP_DIR=$(mktemp -d)
          cat > "$TEMP_DIR/package.json" <<EOF
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": $(jq '.dependencies' package.json | jq 'del(.["@tastematcher/common"])'),
            "engines": {
              "node": ">=22.x"
            }
          }
          EOF
          
          cd "$TEMP_DIR"
          npm install --omit=dev --no-package-lock --production
          
          # Get back to project root to access functions/deploy
          cd $GITHUB_WORKSPACE/functions
          
          # Copy node_modules to deploy
          cp -r "$TEMP_DIR/node_modules" deploy/
          
          # Copy common package build
          if [ -d "$GITHUB_WORKSPACE/common/build" ]; then
            mkdir -p deploy/node_modules/@tastematcher/common
            cp -r $GITHUB_WORKSPACE/common/build/* deploy/node_modules/@tastematcher/common/
            cp $GITHUB_WORKSPACE/common/package.json deploy/node_modules/@tastematcher/common/
            sed -i 's|build/index.|index.|g' deploy/node_modules/@tastematcher/common/package.json
          fi
          
          # Create minimal package.json
          cd deploy
          cat > package.json <<'PKGJSON'
          {
            "name": "@tastematcher/functions",
            "version": "1.0.0",
            "main": "index.js",
            "engines": {
              "node": ">=22.x"
            }
          }
          PKGJSON

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-deploy
          path: functions/deploy
          retention-days: 1

  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    environment:
      name: development
      url: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net
    
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-deploy
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: deploy

      - name: Inspect Function App settings (diagnostic)
        run: |
          echo "=== App settings ==="
          az functionapp config appsettings list \
            --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            -o table

      - name: Ensure app is not pinned to run-from-package (optional)
        run: |
          # If you prefer extracted files under /home/site/wwwroot after deployment, disable run-from-package.
          # This step sets WEBSITE_RUN_FROM_PACKAGE=0 and restarts the function app.
          echo "Checking WEBSITE_RUN_FROM_PACKAGE..."
          CURRENT=$(az functionapp config appsettings list --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" -o tsv)
          echo "Current WEBSITE_RUN_FROM_PACKAGE: '$CURRENT'"
          if [ "$CURRENT" != "0" ]; then
            echo "Setting WEBSITE_RUN_FROM_PACKAGE=0 and restarting app..."
            az functionapp config appsettings set \
              --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --settings WEBSITE_RUN_FROM_PACKAGE=0
            az functionapp restart --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
          else
            echo "WEBSITE_RUN_FROM_PACKAGE already 0 — no change."
          fi

      - name: Confirm files in wwwroot (Kudu)
        run: |
          echo "Listing /home/site/wwwroot (via Kudu API)..."
          KUDU_USER=$(az webapp deployment list-publishing-credentials --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query publishingUserName -o tsv)
          KUDU_PASS=$(az webapp deployment list-publishing-credentials --name ${{ env.AZURE_FUNCTIONAPP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query publishingPassword -o tsv)
          SITE_SCM="https://${{ env.AZURE_FUNCTIONAPP_NAME }}.scm.azurewebsites.net"
          # Use the Kudu VFS API to list the wwwroot directory
          curl -s -u "$KUDU_USER:$KUDU_PASS" "$SITE_SCM/api/vfs/site/wwwroot/" | sed -n '1,200p' || true

      - name: Azure logout
        if: always()
        run: az logout
