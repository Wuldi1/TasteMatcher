name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/frontend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"
  BUILD_OUTPUT: frontend/build
  REACT_APP_API_URL: "https://api.tastematcher.art"
  AZURE_STATIC_WEB_APP: "tastematcher-prd-static"
  AZURE_RESOURCE_GROUP: "tastematcher-prd-rg"

jobs:
  build-test:
    name: Validate, Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package for dependent checks
        run: pnpm run build:common
      - name: Lint shared and frontend code
        run: |
          pnpm --filter @tastematcher/common lint
          pnpm --filter @tastematcher/frontend lint
      - name: Type-check shared and frontend code
        run: |
          pnpm --filter @tastematcher/common typecheck
          pnpm --filter @tastematcher/frontend typecheck
      - name: Run shared and frontend tests
        run: |
          pnpm --filter @tastematcher/common test
          CI=true pnpm --filter @tastematcher/frontend exec react-scripts test --watchAll=false --runInBand
      - name: Build frontend
        run: pnpm run build:frontend
      - name: Validate repository and build artifact
        run: pnpm run validate:static
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 1

  deploy:
    name: Deploy Frontend to Production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: prd
      url: https://tastematcher-prd-static.azurestaticapps.net
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
      - name: Read Static Web Apps deployment token
        run: echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$(az staticwebapp secrets list --name \"$AZURE_STATIC_WEB_APP\" --resource-group \"$AZURE_RESOURCE_GROUP\" --query properties.apiKey -o tsv)" >> "$GITHUB_ENV"
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: build
          output_location: ""
          skip_app_build: true
      - name: Verify replacement frontend
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors https://tastematcher-prd-static.azurestaticapps.net/ >/dev/null
      - name: Azure logout
        if: always()
        run: az logout
