name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'common/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '8'
  FRONTEND_DIR: frontend
  BUILD_OUTPUT: frontend/dist
  AZURE_WEBAPP_NAME: tastematcher-dev-web

jobs:
  build-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @tastematcher/frontend lint

      - name: Test frontend
        run: pnpm --filter @tastematcher/frontend test -- --ci --runInBand

      - name: Build frontend
        run: pnpm --filter @tastematcher/frontend build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 1

  deploy-dev:
    name: Deploy to tastematcher-dev-web
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Archive build output
        run: zip -r dist.zip dist

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: dist.zip
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
