name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'common/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'
  PNPM_VERSION: '8'
  FRONTEND_DIR: frontend
  BUILD_OUTPUT: frontend/build
  AZURE_WEBAPP_NAME: tastematcher-dev-web

jobs:
  build-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @tastematcher/frontend lint

    #   - name: Test frontend
        # run: pnpm --filter @tastematcher/frontend test -- --ci --runInBand

      - name: Build frontend
        run: pnpm --filter @tastematcher/frontend build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 1

  deploy-dev:
    name: Deploy to tastematcher-dev-web
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Create deployment package with serve
        run: |
          cd dist
          # Create package.json for serve
          cat > package.json <<'EOF'
          {
            "name": "tastematcher-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "serve -s . -l 8080"
            },
            "dependencies": {
              "serve": "^14.2.0"
            }
          }
          EOF
          
          # Create web.config for Azure (optional fallback)
          cat > web.config <<'EOF'
          <?xml version="1.0"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="React Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/index.html" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF
          
          zip -r ../dist.zip .
          cd ..

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: dist.zip

      - name: Azure logout
        if: always()
        run: az logout