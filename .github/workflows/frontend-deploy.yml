name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "common/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          # - stg
          - prd

env:
  NODE_VERSION: "22.x"
  PNPM_VERSION: "8"
  FRONTEND_DIR: frontend
  BUILD_OUTPUT: frontend/build
  # Define API URLs for different environments
  API_URL_DEV: "https://tastematcher-dev-api.azurewebsites.net"
  API_URL_STG: "https://tastematcher-stg-api.azurewebsites.net"
  API_URL_PRD: "https://tastematcher-prd-api.azurewebsites.net"

jobs:
  build-pack:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @tastematcher/frontend lint

      - name: Build frontend
        run: pnpm --filter @tastematcher/frontend build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 1

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build-pack
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
      url: ${{ github.event.inputs.environment == 'stg' && 'https://tastematcher-stg-web.azurewebsites.net' || github.event.inputs.environment == 'prd' && 'https://tastematcher-prd-web.azurewebsites.net' || 'https://tastematcher-dev-web.azurewebsites.net' }}

    steps:
      - name: Set Environment Variables
        run: |
          if [ "${{ github.event.inputs.environment }}" == "stg" ]; then
            echo "AZURE_WEBAPP_NAME=tastematcher-stg-web" >> $GITHUB_ENV
            echo "AZURE_RESOURCE_GROUP=tastematcher-stg-rg" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=e105e38a-7820-4c7e-b1da-de05227d6355" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" == "prd" ]; then
            echo "AZURE_WEBAPP_NAME=tastematcher-prd-web" >> $GITHUB_ENV
            echo "AZURE_RESOURCE_GROUP=tastematcher-prd-rg" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=e105e38a-7820-4c7e-b1da-de05227d6355" >> $GITHUB_ENV
          else
            echo "AZURE_WEBAPP_NAME=tastematcher-dev-web" >> $GITHUB_ENV
            echo "AZURE_RESOURCE_GROUP=tastematcher-dev-rg" >> $GITHUB_ENV
            echo "AZURE_SUBSCRIPTION=e105e38a-7820-4c7e-b1da-de05227d6355" >> $GITHUB_ENV
          fi

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - name: Create deployment package with dependencies
        run: |
          cd build
          # Create package.json with serve dependency
          cat > package.json <<'EOF'
          {
            "name": "tastematcher-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "serve -s . -l tcp://0.0.0.0:${PORT:-8080}"
            },
            "dependencies": {
              "serve": "^14.2.3"
            }
          }
          EOF

          # Install dependencies so they're included in the zip
          npm install --production --no-package-lock

          # Create .deployment file to tell Azure to skip build
          cat > .deployment <<'EOF'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT = false
          EOF

          zip -r ../build.zip .
          cd ..

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ github.event.inputs.environment == 'stg' && secrets.AZURE_CREDENTIALS_STG || github.event.inputs.environment == 'prd' && secrets.AZURE_CREDENTIALS_PROD || secrets.AZURE_CREDENTIALS_DEV }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: build.zip
          startup-command: "npm start"

      - name: Azure logout
        if: always()
        run: az logout
