name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/frontend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "common/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".nvmrc"
      - "scripts/ci/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.x"
  BUILD_OUTPUT: frontend/build
  REACT_APP_API_URL: "https://api.tastematcher.art"
  AZURE_WEBAPP_NAME: "tastematcher-prd-web"

jobs:
  build-test:
    name: Validate, Test & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package for dependent checks
        run: pnpm run build:common
      - name: Lint shared and frontend code
        run: |
          pnpm --filter @tastematcher/common lint
          pnpm --filter @tastematcher/frontend lint
      - name: Type-check shared and frontend code
        run: |
          pnpm --filter @tastematcher/common typecheck
          pnpm --filter @tastematcher/frontend typecheck
      - name: Run shared and frontend tests
        run: |
          pnpm --filter @tastematcher/common test
          CI=true pnpm --filter @tastematcher/frontend exec react-scripts test --watchAll=false --runInBand
      - name: Build frontend
        run: pnpm run build:frontend
      - name: Validate repository and build artifact
        run: pnpm run validate:static
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ${{ env.BUILD_OUTPUT }}
          retention-days: 1

  deploy:
    name: Deploy Frontend to Production
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-test
    environment:
      name: prd
      url: https://tastematcher.art
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build
      - name: Create deployment package
        run: |
          cd build
          cat > package.json <<'EOF'
          {
            "name": "tastematcher-frontend",
            "version": "1.0.0",
            "scripts": {
              "start": "serve -s . -l tcp://0.0.0.0:${PORT:-8080}"
            },
            "dependencies": {
              "serve": "^14.2.3"
            },
            "engines": {
              "node": ">=24 <25"
            }
          }
          EOF
          npm install --omit=dev --no-package-lock
          cat > .deployment <<'EOF'
          [config]
          SCM_DO_BUILD_DURING_DEPLOYMENT = false
          EOF
          zip -r ../build.zip .
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: build.zip
          startup-command: "npm start"
      - name: Verify production frontend
        run: curl --fail --silent --show-error --retry 10 --retry-delay 15 --retry-all-errors https://tastematcher.art/ >/dev/null
      - name: Azure logout
        if: always()
        run: az logout
