<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/tastematcher_icon_favicon_32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/tastematcher_icon_favicon_16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/tastematcher_icon_apple_touch_180.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="TasteMatcher — private art advisory" />
    <title>TasteMatcher</title>
    <style>
      .tm-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #344d40;
        background: #f6f4ef;
      }

      .tm-boot__content {
        display: grid;
        justify-items: center;
        gap: 1rem;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .tm-boot__seal {
        position: relative;
        display: grid;
        width: 4rem;
        height: 4rem;
        place-items: center;
      }

      .tm-boot__ring {
        position: absolute;
        inset: 0;
        border: 2px solid rgba(138, 108, 62, 0.22);
        border-top-color: #8a6c3e;
        border-radius: 999px;
        animation: tm-boot-spin 900ms linear infinite;
      }

      .tm-boot__mark {
        width: 2.5rem;
        height: 2.5rem;
        object-fit: cover;
        border: 1px solid #bf9c63;
        border-radius: 0.3rem;
        background: #23372d;
      }

      .tm-boot p {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      @keyframes tm-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tm-boot__ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="tm-boot" role="status" aria-live="polite">
        <div class="tm-boot__content">
          <div class="tm-boot__seal" aria-hidden="true">
            <span class="tm-boot__ring"></span>
            <img
              class="tm-boot__mark"
              src="%PUBLIC_URL%/tastematcher_icon_icon_128.png"
              alt=""
            />
          </div>
          <p>Preparing your private gallery…</p>
        </div>
      </div>
    </div>
  </body>
</html>
